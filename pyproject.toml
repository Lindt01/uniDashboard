[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-dashboard"
version = "0.1.0"
description = "Wochenüberblick über Stundenplan, Prüfungen und Aufgaben aus einer Excel-Datei"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "uni_dashboard/static/fonts/LICENSE-*.txt"]
authors = [{ name = "Mirlind Musa" }]
# Mindestversionen. Die genauen, getesteten Versionen aller Pakete stehen in
# requirements.txt (mit pip-compile daraus erzeugt, von Dependabot aktuell gehalten).
dependencies = [
    "streamlit>=1.51",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "plotly>=5.21",
]

[project.urls]
Repository = "https://github.com/Lindt01/uniDashboard"

[tool.setuptools]
packages = ["uni_dashboard"]

[tool.setuptools.package-data]
uni_dashboard = ["*.css", "static/fonts/*"]

[tool.ruff]
line-length = 120
extend-include = ["*.pyw"]

[tool.ruff.lint]
# E/F: Fehler und Stil (pycodestyle, pyflakes), D: Docstrings
select = ["E", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Testnamen beschreiben sich selbst, einzelne Docstrings wären doppelt
"tests/*" = ["D103"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "uni_dashboard"]
# app.py ist die Streamlit-Seite und läuft beim Import los, daher nur die übrigen Module
addopts = "--doctest-modules --ignore=uni_dashboard/app.py"
# Warnungen als Fehler: Hinweise auf künftige Änderungen in pandas & Co.
# sollen auffallen, bevor sie zum Absturz führen.
filterwarnings = ["error"]
