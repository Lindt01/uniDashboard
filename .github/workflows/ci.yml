# Prüft Stil, Docstrings, Tests und bekannte Sicherheitslücken.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Einmal pro Woche auch ohne Änderung, damit neu bekannt gewordene
  # Sicherheitslücken in den Paketen auffallen
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Älteste Version, die alle festgelegten Pakete unterstützen, und aktuelle
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Pakete installieren (genaue Versionen aus den Lock-Dateien)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Stil und Docstrings (ruff)
        run: ruff check .

      - name: Tests (pytest und Docstring-Beispiele)
        run: pytest -v

      - name: Bekannte Sicherheitslücken (pip-audit)
        run: pip-audit --skip-editable

  
  docker:
    # Erst wenn Stil und Tests grün sind
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen
        run: docker build -t uni-dashboard .

      - name: Container starten und prüfen, ob das Dashboard antwortet
        run: |
          docker run -d --name dashboard -p 8501:8501 uni-dashboard
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 1
          done
          docker logs dashboard
          exit 1