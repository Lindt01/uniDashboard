[theme]
base = "light"
primaryColor = "#1f9d5c"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
borderColor = "#e5e5ea"
font = "Inter"
codeFont = "IBM Plex Mono"
baseRadius = "large"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
port = 8501
# nur von diesem PC erreichbar, nicht aus dem WLAN
address = "localhost"
# Schriften aus uni_dashboard/static/fonts statt von Google Fonts
# (Streamlit liefert den Ordner static/ neben app.py unter app/static/ aus)
enableStaticServing = true

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-700-normal.woff2"
weight = 700

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-400-normal.woff2"
weight = 400
